apiVersion: v1
kind: Namespace
metadata: { name: demo }
---
# Redis: Zustand (Besuchszaehler)
apiVersion: apps/v1
kind: Deployment
metadata: { name: redis, namespace: demo }
spec:
  replicas: 1
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{ containerPort: 6379 }]
          resources: { requests: { memory: 16Mi, cpu: 10m }, limits: { memory: 64Mi, cpu: 100m } }
---
apiVersion: v1
kind: Service
metadata: { name: redis, namespace: demo }
spec: { selector: { app: redis }, ports: [{ port: 6379 }] }
---
# API: darf Pods lesen/loeschen und die eigene Deployment skalieren
apiVersion: v1
kind: ServiceAccount
metadata: { name: api, namespace: demo }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: api, namespace: demo }
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, delete]
  - apiGroups: [""]
    resources: [services, configmaps, serviceaccounts]
    verbs: [list]
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [list]
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [api]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: api, namespace: demo }
subjects: [{ kind: ServiceAccount, name: api, namespace: demo }]
roleRef: { kind: Role, name: api, apiGroup: rbac.authorization.k8s.io }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: api, namespace: demo }
spec:
  replicas: 3
  selector: { matchLabels: { app: api } }
  template:
    metadata: { labels: { app: api } }
    spec:
      serviceAccountName: api
      terminationGracePeriodSeconds: 2
      containers:
        - name: api
          image: python:3.12-alpine
          command: ["python", "-u", "/app/api.py"]
          ports: [{ containerPort: 8000 }]
          volumeMounts: [{ name: code, mountPath: /app }]
          readinessProbe: { httpGet: { path: /healthz, port: 8000 }, periodSeconds: 2 }
          livenessProbe: { httpGet: { path: /healthz, port: 8000 }, periodSeconds: 10 }
          resources: { requests: { memory: 24Mi, cpu: 10m }, limits: { memory: 64Mi, cpu: 200m } }
      volumes: [{ name: code, configMap: { name: api-code } }]
---
apiVersion: v1
kind: Service
metadata: { name: api, namespace: demo }
spec: { selector: { app: api }, ports: [{ port: 8000 }] }
---
# Web: nginx liefert die Oberflaeche und leitet /api/ an den Service weiter
apiVersion: apps/v1
kind: Deployment
metadata: { name: web, namespace: demo }
spec:
  replicas: 1
  selector: { matchLabels: { app: web } }
  template:
    metadata: { labels: { app: web } }
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports: [{ containerPort: 80 }]
          readinessProbe: { httpGet: { path: /, port: 80 }, periodSeconds: 3 }
          volumeMounts:
            - { name: html, mountPath: /usr/share/nginx/html }
            - { name: conf, mountPath: /etc/nginx/conf.d }
          resources: { requests: { memory: 8Mi, cpu: 10m }, limits: { memory: 32Mi, cpu: 100m } }
      volumes:
        - { name: html, configMap: { name: web-html } }
        - { name: conf, configMap: { name: web-conf } }
---
apiVersion: v1
kind: Service
metadata: { name: web, namespace: demo }
spec:
  type: NodePort
  selector: { app: web }
  ports: [{ port: 80, nodePort: 30080 }]
