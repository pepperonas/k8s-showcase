server {
  listen 80;
  # Namen erst pro Anfrage aufloesen: beim Kaltstart ist das Cluster-DNS evtl. noch nicht bereit,
  # ein fester Upstream liesse nginx dann gar nicht erst starten. 10.43.0.10 = CoreDNS in k3s.
  resolver 10.43.0.10 valid=10s ipv6=off;
  set $api http://api.demo.svc.cluster.local:8000;
  location / { root /usr/share/nginx/html; index index.html; }
  location /api/ { proxy_pass $api; }
}
